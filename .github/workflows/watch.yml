name: HKID slot watch

on:
  schedule:
    # Every 5 minutes -- GitHub's floor, and about right: the upstream feed only
    # regenerates every ~15 min, so polling faster would learn nothing new.
    #
    # Cron is UTC; Hong Kong is UTC+8. Hours 23,0-16 UTC = 07:00-01:00 HKT, so
    # this skips 01:00-07:00 HKT, when nobody is cancelling appointments. That
    # is ~25% fewer requests, and the runner never even starts.
    #
    # Relies on this repo being PUBLIC (unlimited Actions minutes). If it ever
    # goes private, drop to */30 or the 2000-min free tier runs out in a week
    # and the schedule stops silently.
    # Ticks are best-effort and can be delayed or dropped under load.
    - cron: "*/5 23,0-16 * * *"
  workflow_dispatch:
    inputs:
      test_push:
        description: "Send a test notification even if nothing qualifies"
        type: boolean
        default: false

concurrency:
  group: hkid-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Each run polls for ~50 min rather than exiting immediately, so the cadence
    # comes from this job rather than from GitHub's scheduler -- which drops most
    # */5 ticks under load and delivers roughly one dispatch an hour.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7

      # Carry state.json across runs so an already-reported slot is not re-pushed.
      - uses: actions/cache@v6
        with:
          path: |
            state.json
            history.db
          key: hkid-state-${{ github.run_id }}
          restore-keys: hkid-state-

      - name: Watch for openings
        run: |
          set -u
          deadline=$(( $(date +%s) + 50*60 ))
          first=1
          while :; do
            # A --test push is a one-off, not something to repeat every 5 min.
            if [ "$first" = 1 ]; then
              python3 check.py ${{ inputs.test_push && '--test' || '' }} || true
              first=0
            else
              python3 check.py || true
            fi
            hour=$(date -u +%H)
            # Stop at the deadline, or on entering the 01:00-07:00 HKT quiet window.
            if [ "$(date +%s)" -ge "$deadline" ]; then break; fi
            if [ "$hour" -ge 17 ] && [ "$hour" -le 22 ]; then break; fi
            sleep 300
          done
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TARGET_DATE: ${{ secrets.TARGET_DATE }}
          TARGET_TIME: ${{ secrets.TARGET_TIME }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}